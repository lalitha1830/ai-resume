<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | ResumeAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="error-page">
    <div class="error-code" aria-hidden="true">404</div>
    <h1>Page Not Found</h1>
    <p style="color:var(--text-secondary); max-width:400px; margin:0 auto 2rem;">
      The page you're looking for doesn't exist or may have been moved.
    </p>
    <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to Home</a>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline">Dashboard</a>
    </div>
  </main>
</body>
</html>
